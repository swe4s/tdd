
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install matplotlib pycodestyle

      - name: Download datasets
        run: |
          mkdir -p data
          curl -fLsS "https://docs.google.com/uc?export=download&id=1AsXP_OGs1O_TDeXiZjk3fYV1SrG4vwXF" -o data/Agrofood_co2_emission.csv
          curl -fLsS "https://docs.google.com/uc?export=download&id=19YEPysdnK7VCXuAe9Og9pwYkNT5CbQzr" -o data/IMF_GDP.csv

      - name: Check Python code style
        run: |
          pycodestyle src/fire_gdp.py src/plot_fire_gdp.py test/unit/test_fire_gdp.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s test/unit -v

      - name: Run functional tests
        run: bash test/func/test_fire_gdp.sh
